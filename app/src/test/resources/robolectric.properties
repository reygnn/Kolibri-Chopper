# Robolectric config for ALL Robolectric unit tests in this module.
#
# sdk: Robolectric 4.16.1 ships android-all jars up to API 36, and the app is
# minSdk = targetSdk = compileSdk = 36, so this matches the one and only level
# the app runs at. Pinning it explicitly means a later compileSdk/targetSdk bump
# can't silently ask Robolectric for an SDK jar it doesn't have yet — the tests
# stay on 36 until this line is updated deliberately.
sdk=36

# No `application=` override on purpose: AndroidManifest.xml declares no custom
# Application (android:name is absent), so Robolectric already instantiates the
# stub android.app.Application. There is nothing here — no ACRA, no Timber, no
# CoroutineScope — to leak across tests, unlike the sister launcher whose
# properties file pins one for exactly that reason.
